plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simple.desktimer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simple.desktimer'
        minSdk 26          // Android 8.0 及以上
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 使用项目内固定的签名文件：每次重新编译出的 APK 签名一致，可直接覆盖安装升级
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 不依赖任何第三方库，只用 Android 系统自带组件
dependencies {
}
